<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Calor Wi-Fi - Universidad de Sucre</title>

    <!-- CSS de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e; /* Fondo oscuro para resaltar el mapa satelital */
        }
        header {
            background-color: #1a4f24;
            color: white;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 3px solid #f1c40f;
            position: relative;
            z-index: 10;
        }
        h2 { margin: 0; font-size: 24px; }
        p { margin: 5px 0 0 0; font-size: 15px; opacity: 0.9; }

        #map-wrap {
            position: relative;
            height: 82vh;
            width: 95%;
            margin: 20px auto;
        }
        #map {
            height: 100%;
            width: 100%;
            border: 2px solid #555;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: #111;
        }

        /* ---------- Panel flotante "en vivo" con las 4 zonas ---------- */
        #live-panel {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 500;
            background: rgba(20, 24, 20, 0.88);
            border: 1px solid rgba(241, 196, 15, 0.35);
            border-radius: 10px;
            padding: 12px 14px;
            min-width: 218px;
            color: #eee;
            backdrop-filter: blur(3px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
        }
        #live-panel h3 {
            margin: 0 0 4px 0;
            font-size: 13px;
            letter-spacing: .3px;
            color: #f1c40f;
            font-weight: 600;
        }
        #live-panel .sub {
            font-size: 10.5px;
            color: #9db89f;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #2ecc71;
            box-shadow: 0 0 6px #2ecc71;
            animation: livePulse 1.4s infinite ease-in-out;
            flex-shrink: 0;
        }
        @keyframes livePulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(.7); }
        }
        .zone-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background .2s ease;
        }
        .zone-row:hover { background: rgba(255,255,255,0.08); }
        .zone-row .name-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12.5px;
        }
        .zone-swatch {
            width: 10px; height: 10px; border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 5px currentColor;
        }
        .zone-row .val {
            font-weight: 700;
            font-size: 13.5px;
            min-width: 62px;
            text-align: right;
            transition: color .3s ease;
        }
        .val-flash { animation: flashVal .6s ease; }
        @keyframes flashVal {
            0% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* ---------- Etiquetas permanentes con el nombre de cada zona ---------- */
        .zone-label {
            background: rgba(15, 18, 15, 0.82) !important;
            border: 1px solid rgba(255,255,255,0.25) !important;
            color: #fff !important;
            font-weight: 600;
            font-size: 12px;
            padding: 3px 9px !important;
            border-radius: 20px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .zone-label::before { display: none; }

        /* ---------- Icono de marcador animado (radar pulsante) ---------- */
        .pulse-wrap {
            position: relative;
            width: 26px;
            height: 26px;
        }
        .pulse-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.9);
            z-index: 3;
            transition: background-color .5s ease;
        }
        .pulse-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            opacity: 0.75;
            animation: pulseRing 2.2s cubic-bezier(0.25,0.6,0.4,1) infinite;
        }
        @keyframes pulseRing {
            0%   { transform: scale(1);   opacity: 0.55; }
            70%  { transform: scale(3.4); opacity: 0; }
            100% { transform: scale(3.4); opacity: 0; }
        }
        /* Ráfaga extra al hacer click/touch sobre una zona */
        .pulse-burst {
            position: absolute;
            top: 50%; left: 50%;
            width: 14px; height: 14px;
            margin: -7px 0 0 -7px;
            border-radius: 50%;
            border: 3px solid #fff;
            opacity: 1;
            animation: burst .7s ease-out forwards;
        }
        @keyframes burst {
            0%   { transform: scale(1);  opacity: 1; }
            100% { transform: scale(6);  opacity: 0; }
        }

        .leaflet-popup-content-wrapper {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 10px;
        }
        .popup-box { min-width: 190px; text-align: center; font-family: inherit; }
        .popup-box .zona-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .popup-box .zona-val { font-weight: 800; font-size: 19px; display: block; margin: 4px 0 2px; }
        .popup-box .zona-estado {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
            color: #fff;
        }
        .popup-photo {
            width: 100%;
            height: 90px;
            border-radius: 8px;
            margin-bottom: 6px;
            object-fit: cover;
        }
        .popup-photo-placeholder {
            width: 100%;
            height: 70px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #777;
            background: repeating-linear-gradient(45deg, #eee, #eee 8px, #f6f6f6 8px, #f6f6f6 16px);
        }
    </style>
</head>

            <div id="zone-rows"></div>
        </div>
    </div>

            { id: "cafeteria",     nombre: "Cafetería",     lat: 9.3160117343337,   lng: -75.3866300289613,  base: 28.25, min: 20, max: 34, foto: "" },

        function estadoDe(mbps) {
            if (mbps >= 40) return { texto: "Excelente",  color: "#27ae60" };      // Verde oscuro
            if (mbps >= 25) return { texto: "Bueno",      color: "#2ecc71" };      // Verde
            if (mbps >= 10) return { texto: "Aceptable",  color: "#f39c12" };      // Naranja
            return { texto: "Débil",        color: "#e74c3c" };                     // Rojo
        }

        // ==========================================================
        // 2. MAPA BASE  (maxNativeZoom evita que al hacer zoom se
        //    quede en gris: sigue mostrando la última imagen
        //    disponible, ampliada, en vez de perder el contenido)
        // ==========================================================
        var BASE_ZOOM = 18;
        var map = L.map('map', { zoomSnap: 0.25 }).setView([9.3155, -75.3876], BASE_ZOOM);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19,
            minZoom: 15
        }).addTo(map);

        // ==========================================================
        // 3. CAPA DE CALOR  (se re-escala en cada zoom para que las
        //    manchas conserven su tamaño relativo real y no se vean
        //    ni diminutas ni pixeladas al acercar/alejar)
        // ==========================================================
        function intensidadDe(mbps) {
            // normaliza aprox. 8-58 Mbps -> 0.15-1.0 de intensidad
            return Math.max(0.15, Math.min(1, (mbps - 5) / 55));
        }

        var heatData = zonas.map(z => [z.lat, z.lng, intensidadDe(z.base)]);

        var heat = L.heatLayer(heatData, {
            radius: 85,
            blur: 40,
            maxZoom: 19,
            minOpacity: 0.5,
            gradient: { 0.20: 'red', 0.50: 'orange', 0.80: 'yellow', 1.00: 'lime' }
        }).addTo(map);

        function escalarHeatmap() {
            var factor = Math.pow(1.35, map.getZoom() - BASE_ZOOM);
            var radius = Math.max(20, Math.min(220, 85 * factor));
            var blur = Math.max(12, Math.min(110, 40 * factor));
            heat.setOptions({ radius: radius, blur: blur });
        }
        map.on('zoomend', escalarHeatmap);

        // ==========================================================
        // 4. MARCADORES ANIMADOS + ETIQUETA PERMANENTE CON EL NOMBRE
        // ==========================================================
        function crearIcono(color) {
            return L.divIcon({
                className: '',
                html: '<div class="pulse-wrap">' +
                          '<div class="pulse-ring" style="background:' + color + '"></div>' +
                          '<div class="pulse-core" style="background:' + color + '"></div>' +
                      '</div>',
                iconSize: [26, 26],
                iconAnchor: [13, 13],
                popupAnchor: [0, -12]
            });
        }

        function popupHTML(z) {
            var est = estadoDe(z.valor);
            var fotoHTML = z.foto
                ? '<img class="popup-photo" src="' + z.foto + '" alt="' + z.nombre + '">'
                : '<div class="popup-photo-placeholder">📷 Foto pendiente de ' + z.nombre + '</div>';
            return '<div class="popup-box">' +
                        fotoHTML +
                        '<div class="zona-title">' + z.nombre + '</div>' +
                        '<span class="zona-val" style="color:' + est.color + '">' + z.valor.toFixed(2) + ' Mbps</span>' +
                        '<span class="zona-estado" style="background:' + est.color + '">' + est.texto + '</span>' +
                   '</div>';
        }

        zonas.forEach(function (z) {
            z.valor = z.base;
            var est = estadoDe(z.valor);

            z.marker = L.marker([z.lat, z.lng], { icon: crearIcono(est.color) }).addTo(map);
            z.marker.bindPopup(popupHTML(z));
            z.marker.bindTooltip(z.nombre, { permanent: true, direction: 'top', offset: [0, -16], className: 'zone-label' });

            z.marker.on('click', function () {
                // ráfaga animada al tocar/hacer click en la zona
                var el = z.marker.getElement();
                if (el) {
                    var wrap = el.querySelector('.pulse-wrap');
                    var burst = document.createElement('div');
                    burst.className = 'pulse-burst';
                    burst.style.borderColor = est.color;
                    wrap.appendChild(burst);
                    setTimeout(function () { burst.remove(); }, 700);
                }
                map.flyTo([z.lat, z.lng], Math.max(map.getZoom(), 19), { duration: 1.1 });
                resaltarFila(z.id);
            });
        });

        // ==========================================================
        // 5. PANEL LATERAL CON LAS 4 ZONAS EN VIVO
        // ==========================================================
        var rowsWrap = document.getElementById('zone-rows');
        zonas.forEach(function (z) {
            var row = document.createElement('div');
            row.className = 'zone-row';
            row.id = 'row-' + z.id;
            row.innerHTML =
                '<div class="name-wrap">' +
                    '<span class="zone-swatch" id="swatch-' + z.id + '" style="background:' + estadoDe(z.valor).color + '; color:' + estadoDe(z.valor).color + '"></span>' +
                    '<span>' + z.nombre + '</span>' +
                '</div>' +
                '<span class="val" id="val-' + z.id + '" style="color:' + estadoDe(z.valor).color + '">' + z.valor.toFixed(2) + '</span>';
            row.addEventListener('click', function () {
                map.flyTo([z.lat, z.lng], 19, { duration: 1.1 });
                z.marker.fire('click');
            });
            rowsWrap.appendChild(row);
        });

        function resaltarFila(id) {
            var row = document.getElementById('row-' + id);
            if (!row) return;
            row.style.background = 'rgba(255,255,255,0.18)';
            setTimeout(function () { row.style.background = ''; }, 900);
        }

        // ==========================================================
        // 6. SIMULACIÓN EN VIVO: cambia el valor de las 4 zonas
        //    cada 5 segundos (fluctúa dentro de un rango realista
        //    alrededor del valor base de cada zona)
        // ==========================================================
        function actualizarZonas() {
            zonas.forEach(function (z) {
                var rango = z.max - z.min;
                var nuevo = z.min + Math.random() * rango;
                // suaviza el salto para que no se vea errático
                z.valor = z.valor + (nuevo - z.valor) * 0.6;
                z.valor = Math.max(z.min, Math.min(z.max, z.valor));

                var est = estadoDe(z.valor);

                // marcador + popup
                var el = z.marker.getElement();
                if (el) {
                    var core = el.querySelector('.pulse-core');
                    var ring = el.querySelector('.pulse-ring');
                    if (core) core.style.background = est.color;
                    if (ring) ring.style.background = est.color;
                }
                z.marker.setPopupContent(popupHTML(z));
                if (z.marker.isPopupOpen()) z.marker.getPopup().update();

                // panel lateral
                var valEl = document.getElementById('val-' + z.id);
                var swatchEl = document.getElementById('swatch-' + z.id);
                if (valEl) {
                    valEl.textContent = z.valor.toFixed(2);
                    valEl.style.color = est.color;
                    valEl.classList.remove('val-flash');
                    void valEl.offsetWidth; // reinicia la animación
                    valEl.classList.add('val-flash');
                }
                if (swatchEl) {
                    swatchEl.style.background = est.color;
                    swatchEl.style.color = est.color;
                }
            });

            // capa de calor
            heat.setLatLngs(zonas.map(z => [z.lat, z.lng, intensidadDe(z.valor)]));
        }

        setInterval(actualizarZonas, 5000);
    </script>
</body>
</html>
